<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Vibe - Premium CV Builder & PDF Generator</title>
    
    <!-- Google Fonts for ultimate typography combinations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300&family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for crisp modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2pdf.js Library from CDN for crisp local PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Core Modular Stylesheets -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/app.css">
    <link rel="stylesheet" href="src/css/editor.css">
    
    <!-- Modular Layout Templates loaded upfront for instant switching -->
    <link rel="stylesheet" href="src/css/templates/executive.css">
    <link rel="stylesheet" href="src/css/templates/academic.css">
    <link rel="stylesheet" href="src/css/templates/creative.css">
    <link rel="stylesheet" href="src/css/templates/tech.css">
</head>
<body class="editor-dark-mode"> <!-- Default editor background is dark glassmorphic, CV itself is paper white -->
    
    <header class="app-header">
        <div class="header-logo">
            <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
            <div class="logo-text">
                <h1>CV Vibe</h1>
                <span>Professional Resume Builder</span>
            </div>
        </div>
        
        <div class="header-controls">
            <!-- Mobile View Switcher Tabs (active on screens <= 1024px) -->
            <div class="mobile-tab-switch">
                <button type="button" id="btn-tab-editor" class="btn btn-sm btn-primary active"><i class="fa-solid fa-pen-to-square"></i> Editor</button>
                <button type="button" id="btn-tab-preview" class="btn btn-sm btn-secondary"><i class="fa-solid fa-eye"></i> Preview</button>
            </div>

            <!-- Dynamic Actions -->
            <button id="btn-load-sample" class="btn btn-secondary" title="Fill form with high-quality sample data">
                <i class="fa-solid fa-database"></i> Load Sample Data
            </button>
            <button id="btn-reset" class="btn btn-danger" title="Clear all input fields">
                <i class="fa-solid fa-trash-arrow-up"></i> Reset Form
            </button>
            <button id="btn-export-json" class="btn btn-secondary" title="Save resume data as a local JSON file">
                <i class="fa-solid fa-file-export"></i> Export JSON
            </button>
            <label for="input-import-json" class="btn btn-secondary btn-file-label" title="Upload an exported CV Vibe JSON file">
                <i class="fa-solid fa-file-import"></i> Import JSON
                <input type="file" id="input-import-json" accept=".json" style="display: none;">
            </label>
            
            <span class="divider"></span>
            
            <!-- Dark/Light toggle for dashboard -->
            <button id="btn-toggle-editor-theme" class="btn-theme-toggle" title="Toggle Editor Dark/Light Theme">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun" style="display: none;"></i>
            </button>
        </div>
    </header>

    <main class="workspace">
        
        <!-- Left Side: Form Accordion Editor -->
        <section class="editor-panel">
            <div class="editor-scroll-container">
                
                <!-- Quick Settings & Style Controls -->
                <div class="editor-section editor-card">
                    <h3 class="section-title"><i class="fa-solid fa-palette text-accent"></i> Design Customizer</h3>
                    <div class="customizer-grid">
                        <div class="control-group">
                            <label for="select-template"><i class="fa-solid fa-layer-group"></i> Template</label>
                            <select id="select-template" class="form-control">
                                <option value="executive">The Executive (Modern Two-Column)</option>
                                <option value="academic">The Academic (Classic Minimalist)</option>
                                <option value="creative">The Creative (Bold & Graphic)</option>
                                <option value="tech">The Tech Pioneer (Structured Grid)</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="select-font-combo"><i class="fa-solid fa-font"></i> Typography</label>
                            <select id="select-font-combo" class="form-control">
                                <option value="modern">Inter & Poppins (Sans-Serif)</option>
                                <option value="elegant">Lora & Merriweather (Elegant Serif)</option>
                                <option value="clean">Roboto & Inter (Clean Tech)</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label><i class="fa-solid fa-circle-half-stroke"></i> Theme Accent Color</label>
                            <div class="color-palette" id="color-palette-picker">
                                <button type="button" class="color-swatch active" style="background-color: #0f172a;" data-color="#0f172a"></button>
                                <button type="button" class="color-swatch" style="background-color: #1e3a8a;" data-color="#1e3a8a"></button>
                                <button type="button" class="color-swatch" style="background-color: #064e3b;" data-color="#064e3b"></button>
                                <button type="button" class="color-swatch" style="background-color: #581c87;" data-color="#581c87"></button>
                                <button type="button" class="color-swatch" style="background-color: #701a75;" data-color="#701a75"></button>
                                <div class="custom-color-picker-wrapper">
                                    <input type="color" id="custom-accent-color" value="#0f172a">
                                    <i class="fa-solid fa-eye-dropper"></i>
                                </div>
                            </div>
                        </div>

                        <div class="control-group">
                            <label for="range-spacing"><i class="fa-solid fa-up-down-left-right"></i> Document Spacing</label>
                            <div class="range-slider-wrapper">
                                <input type="range" id="range-spacing" min="0.6" max="1.5" step="0.05" value="1.0" class="range-slider">
                                <span class="range-value" id="spacing-val">1.0x</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion-container">
                    
                    <!-- 1. PERSONAL INFORMATION -->
                    <div class="accordion-item expanded">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-user-tie text-accent"></i> Personal Information</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div class="photo-upload-container">
                                <div class="photo-preview-wrapper">
                                    <img id="photo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2364748b'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Profile Preview">
                                    <button type="button" id="btn-remove-photo" class="btn-remove-photo" style="display: none;"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                                <div class="photo-upload-actions">
                                    <label for="input-photo" class="btn btn-secondary btn-sm">
                                        <i class="fa-solid fa-upload"></i> Upload Photo
                                    </label>
                                    <input type="file" id="input-photo" accept="image/*" style="display: none;">
                                    <span class="photo-hint">Supports JPEG, PNG. Max 1MB.</span>
                                </div>
                            </div>

                            <div class="form-grid">
                                <div class="control-group col-span-2">
                                    <label for="input-name">Full Name *</label>
                                    <input type="text" id="input-name" class="form-control" placeholder="e.g. John Doe">
                                </div>
                                <div class="control-group col-span-2">
                                    <label for="input-title">Professional Title *</label>
                                    <input type="text" id="input-title" class="form-control" placeholder="e.g. Senior Software Engineer">
                                </div>
                                <div class="control-group">
                                    <label for="input-email">Email Address *</label>
                                    <input type="email" id="input-email" class="form-control" placeholder="e.g. johndoe@email.com">
                                </div>
                                <div class="control-group">
                                    <label for="input-phone">Phone Number *</label>
                                    <input type="text" id="input-phone" class="form-control" placeholder="e.g. +62 812-3456-789">
                                </div>
                                <div class="control-group col-span-2">
                                    <label for="input-address">Address / Location</label>
                                    <input type="text" id="input-address" class="form-control" placeholder="e.g. Jakarta, Indonesia">
                                </div>
                                <div class="control-group">
                                    <label for="input-website">Portfolio / Website</label>
                                    <input type="url" id="input-website" class="form-control" placeholder="e.g. https://johndoe.dev">
                                </div>
                                <div class="control-group">
                                    <label for="input-linkedin">LinkedIn Profile</label>
                                    <input type="url" id="input-linkedin" class="form-control" placeholder="e.g. https://linkedin.com/in/johndoe">
                                </div>
                                <div class="control-group col-span-2">
                                    <label for="input-github">GitHub Profile</label>
                                    <input type="url" id="input-github" class="form-control" placeholder="e.g. https://github.com/johndoe">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. PROFESSIONAL SUMMARY -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-file-invoice text-accent"></i> Professional Summary</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div class="control-group">
                                <label for="textarea-summary">Summary / Executive Objective</label>
                                <textarea id="textarea-summary" rows="5" class="form-control" placeholder="Describe your career focus, key achievements, and skills in a concise paragraph..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 3. WORK EXPERIENCE -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-briefcase text-accent"></i> Work Experience</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="experience-list" class="dynamic-list-container">
                                <!-- Dynamic jobs will be added here -->
                            </div>
                            <button type="button" id="btn-add-experience" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Work Experience
                            </button>
                        </div>
                    </div>

                    <!-- 4. EDUCATION -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-graduation-cap text-accent"></i> Education</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="education-list" class="dynamic-list-container">
                                <!-- Dynamic education rows will be added here -->
                            </div>
                            <button type="button" id="btn-add-education" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Education
                            </button>
                        </div>
                    </div>

                    <!-- 5. SKILLS -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-screwdriver-wrench text-accent"></i> Skills</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="skills-list" class="dynamic-list-container">
                                <!-- Dynamic skills go here -->
                            </div>
                            <button type="button" id="btn-add-skill" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Skill
                            </button>
                        </div>
                    </div>

                    <!-- 6. PROJECTS & PORTFOLIO -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-diagram-project text-accent"></i> Projects</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="projects-list" class="dynamic-list-container">
                                <!-- Dynamic projects go here -->
                            </div>
                            <button type="button" id="btn-add-project" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Project
                            </button>
                        </div>
                    </div>

                    <!-- 7. LANGUAGES -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-language text-accent"></i> Languages</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="languages-list" class="dynamic-list-container">
                                <!-- Dynamic languages go here -->
                            </div>
                            <button type="button" id="btn-add-language" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Language
                            </button>
                        </div>
                    </div>

                    <!-- 8. CERTIFICATIONS / ADDITIONAL -->
                    <div class="accordion-item">
                        <button class="accordion-header">
                            <span><i class="fa-solid fa-award text-accent"></i> Certifications & Awards</span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </button>
                        <div class="accordion-content">
                            <div id="certifications-list" class="dynamic-list-container">
                                <!-- Dynamic certifications go here -->
                            </div>
                            <button type="button" id="btn-add-certification" class="btn btn-secondary btn-block mt-3">
                                <i class="fa-solid fa-plus"></i> Add Certification
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </section>
        
        <!-- Right Side: Interactive Real-Time Live Preview Pane -->
        <section class="preview-panel">
            
            <!-- Premium Preview Floating Actions -->
            <div class="preview-toolbar">
                <div class="toolbar-left">
                    <span class="preview-status"><span class="pulse-indicator"></span> Real-time Sync</span>
                </div>
                <div class="toolbar-right">
                    <!-- Zoom Controls -->
                    <div class="zoom-controls">
                        <button id="btn-zoom-out" class="btn-zoom" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                        <span id="zoom-level">85%</span>
                        <button id="btn-zoom-in" class="btn-zoom" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                    </div>
                    <span class="toolbar-divider"></span>
                    <button id="btn-print" class="btn btn-secondary" title="Open native print dialog (recommened for exact vector PDFs)">
                        <i class="fa-solid fa-print"></i> Print CV
                    </button>
                    <button id="btn-download-pdf" class="btn btn-primary" title="Instantly render and download CV as PDF">
                        <i class="fa-solid fa-download"></i> Download PDF
                    </button>
                </div>
            </div>

            <!-- Scrollable Canvas Wrapper -->
            <div class="preview-scroll-wrapper">
                <div class="canvas-zoom-container" id="canvas-zoom-container" style="transform: scale(0.85); transform-origin: top center;">
                    <!-- The actual A4 page targeted by printer CSS and html2pdf -->
                    <article class="cv-page template-executive" id="cv-preview-document">
                        <!-- Dynamic rendered content goes inside here -->
                        <div class="cv-loading-placeholder">
                            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading Preview Document...
                        </div>
                    </article>
                </div>
            </div>
            
        </section>

    </main>

    <!-- Main Module Orchestrator -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
